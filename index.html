<!--
 ============================================================================
  STAR-CRUSH // MEGALOTTO
  Matthews Operations Lab // Interactive Division
 ----------------------------------------------------------------------------
  Single file. Zero build. Zero libraries. Runs on GitHub Pages as-is.
  Rendering: Canvas 2D (pseudo-3D projection, Redline Run engine lineage).
  Audio: procedural WebAudio synthwave (no audio files).
  Haptics: navigator.vibrate (Android) + iOS 18 switch-input tap fallback.

  GAME FLOW (locked narrative script)
    Phase 1  Megalotto Ticket & Ingress ......... scrTicket()
    Phase 2  Identity Forge + Warzone Gunsmith .. scrForge() / scrGun()
    Phase 3  Death Race, Mars → Earth ........... scrSitrep() / RACE engine
    Phase 4  Outcome A (death) / B (victory) .... outcomeDeath() / outcomeWin()
    Phase 5  Spaceport City Hub (walkaround) .... scrHub() / HUB scene

  CONTENT PIPELINE
    - DEFAULT_TABLES: weighted [text, weight] tables (the Category Injector).
      Editable in-game: Settings → Data Terminal (JSON), saved locally.
    - PARTS[*].img / "sprites" in the Data Terminal: any part can be replaced
      by a PNG layer (URL or data URI). Layers composite in LAYER order, so
      hand-drawn art drops straight into the procedural ship.
 ============================================================================
-->
<style>

function wpick(t){if(!t||!t.length)return'';let tot=0;for(const e of t)tot+=Array.isArray(e)?Math.max(0,+e[1]||0):1;let r=R()*tot;for(const e of t){r-=Array.isArray(e)?Math.max(0,+e[1]||0):1;if(r<=0)return Array.isArray(e)?e[0]:e}const l=t[t.length-1];return Array.isArray(l)?l[0]:l}

 x.save();x.globalCompositeOperation='lighter';const eg=x.createRadialGradient(sx,sy+S0*.35,0,sx,sy+S0*.35,S0*1.4);eg.addColorStop(0,rgba(cf.t.col,o.boost?.18:.08));eg.addColorStop(1,rgba(cf.t.col,0));x.fillStyle=eg;x.fillRect(sx-S0*1.5,sy-S0,S0*3,S0*3);x.restore();

/* ===========================================================================
   13. RACE ENGINE — multi-axis coaster track (Redline Run lineage)
   Track space: x∈[-1,1] lateral, y∈[-.75,.75] vertical, z = depth ahead.
   The track bends ahead of you (cx/cy curvature, sampled per frame into a
   lookup), and the camera rolls with it — so the horizon climbs, dives,
   twists and flips upside down while your controls stay screen-aligned.
   =========================================================================== */
const RC={};let SKY={},GRAIN=null;const keys={};let bh=false,drag=null,lx=0,ly=0;
const ST=Array.from({length:80},()=>({x:rr(-3,3),y:rr(-2,2),z:rr(1,85)}));
const BZ=[];for(let z=0;z<=92;z+=2)BZ.push(z);const BX=new Float32Array(BZ.length),BY=new Float32Array(BZ.length);
function proj(x,y,z){const s=1/(1+z/(7*(RC.fov||1)));return[W/2+x*U*s,CY+y*V*s,s]}
function bendAt(z){if(z<=0)return[0,0];const f=Math.min(z,92)/2,i=Math.floor(f),k=f-i,j=Math.min(i+1,BZ.length-1);return[BX[i]+(BX[j]-BX[i])*k,BY[i]+(BY[j]-BY[i])*k]}
function P(x,y,z){const b=bendAt(z);return proj(x+b[0],y+b[1],z)}
const legAt=pr=>{for(let i=0;i<LEG_END.length;i++)if(pr<LEG_END[i])return i;return LEGS.length-1};
const sstep=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
function trk(d){const tot=RC.total||2300,i=legAt(cl(d/tot,0,.99999)),L=LEGS[i],Pv=LEGS[Math.max(0,i-1)],st=(i?LEG_END[i-1]:0)*tot,len=L.f*tot,k=i?sstep((d-st)/140):1,u=cl((d-st)/len,0,1);
 const A=q=>lerp(Pv.trk[q]||0,L.trk[q]||0,k);
 const cx=A('cx')*(Math.sin(d*.0043+1.3)*.62+Math.sin(d*.0117+.4)*.38)+A('bx');
 const cy=A('cy')*(Math.sin(d*.0051+.7)*.6+Math.sin(d*.0133+2.1)*.4)+A('by');
 let roll=-cx*.55*A('rk');
 if(L.trk.spin)roll+=TAU*L.trk.spin*sstep(u);
 if(L.trk.half)roll+=Math.PI*sstep((u-.22)/.13)*(1-sstep((u-.68)/.13));
 return{cx,cy,roll}}
function computeBends(){for(let i=0;i<BZ.length;i++){const z=BZ[i],T=trk(RC.dist+z*.5);BX[i]=.00135*T.cx*z*z;BY[i]=.00135*T.cy*z*z}}

/* ===========================================================================
   16b. POST-PROCESSING — bloom + chromatic aberration + spring screen-kick
   Bloom: downsample the frame, multiply it by itself (≈ brightness³) so only
   lasers, thrusters, explosions and neon survive, then add it back blurred at
   two sizes with 'lighter'. Chromatic aberration: pull red and blue out of the
   frame and re-add them radially offset, scaled with speed and impacts.
   Pure canvas compositing: no ctx.filter, so it works in mobile Safari too.
   =========================================================================== */
const FX={};let FXQ=1,FT=.016,FTN=0;
function fxCanvas(n,w,h){let c=FX[n];if(!c||c.width!==w||c.height!==h){c=FX[n]=document.createElement('canvas');c.width=w;c.height=h;c.x=c.getContext('2d')}return c}
function postFX(bloom,ca){if(cv.width<4||cv.height<4)return;if(!S.set.fx||FXQ<1)ca=0;if(FXQ<1)bloom*=.7;const cw=cv.width,ch=cv.height;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=true;
 if(bloom>0){const w1=Math.max(2,cw>>3),h1=Math.max(2,ch>>3),A=fxCanvas('a',w1,h1),B=fxCanvas('b',w1,h1),C=fxCanvas('c',Math.max(2,cw>>5),Math.max(2,ch>>5));
  A.x.globalCompositeOperation='copy';A.x.drawImage(cv,0,0,w1,h1);
  B.x.globalCompositeOperation='copy';B.x.drawImage(A,0,0);A.x.globalCompositeOperation='multiply';A.x.drawImage(B,0,0);A.x.drawImage(B,0,0);A.x.drawImage(B,0,0);
  C.x.globalCompositeOperation='copy';C.x.drawImage(A,0,0,C.width,C.height);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=bloom;ctx.drawImage(A,0,0,cw,ch);ctx.globalAlpha=Math.min(1,bloom*1.2);ctx.drawImage(C,0,0,cw,ch)}
 if(ca>.02){ca=Math.min(ca,1);const w2=Math.max(2,cw>>1),h2=Math.max(2,ch>>1),Rc=fxCanvas('r',w2,h2),Bc=fxCanvas('bl',w2,h2);
  for(const[c,col]of[[Rc,'#ff0000'],[Bc,'#0000ff']]){c.x.globalCompositeOperation='copy';c.x.drawImage(cv,0,0,w2,h2);c.x.globalCompositeOperation='multiply';c.x.fillStyle=col;c.x.fillRect(0,0,w2,h2)}
  const keep=Math.round(255*(1-ca*.85));ctx.globalAlpha=1;ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${keep},255,${keep})`;ctx.fillRect(0,0,cw,ch);
  const dx=cw*ca*.011,dy=ch*ca*.011;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=ca*.85;ctx.drawImage(Rc,-dx,-dy,cw+dx*2,ch+dy*2);ctx.drawImage(Bc,dx,dy,cw-dx*2,ch-dy*2)}
 ctx.restore()}
/* Spring-loaded camera kick: crisp punch on impacts, gates, boosts */
function kick(m){if(!RC.kv)return;RC.kv[0]+=rr(-1,1)*m*90;RC.kv[1]+=rr(-.6,1)*m*90;RC.kv[2]+=rr(-1,1)*m*.09}
function kickUpd(dt){if(!RC.kv)return;for(let i=0;i<3;i++){RC.kv[i]+=(-RC.kk[i]*520-RC.kv[i]*22)*dt;RC.kk[i]+=RC.kv[i]*dt}}

/* ===========================================================================
   17. MENU BACKDROP (title / ticket / forge / gunsmith)
   =========================================================================== */
let MT=0;function menuDraw(dt){MT+=dt;CY=H*.5;
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05020c');g.addColorStop(.5,'#2a0a45');g.addColorStop(.501,'#0a0414');g.addColorStop(1,'#12041f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const sr=Math.min(W,H)*.2,sy=CY-sr*.45;g=ctx.createLinearGradient(0,sy-sr,0,sy+sr);g.addColorStop(0,'#ffd23f');g.addColorStop(1,'#ff2bd6');ctx.fillStyle=g;ctx.beginPath();ctx.arc(W/2,sy,sr,Math.PI,TAU);ctx.fill();
 ctx.fillStyle='#2a0a45';for(let i=0;i<6;i++){const y=sy-sr*.1-i*sr*.15;ctx.fillRect(W/2-sr,y,sr*2,2+i*.8)}
 ctx.strokeStyle='#d8f4ff';ctx.lineWidth=1.2;for(const s of ST){s.z-=6*dt;if(s.z<1){s.z=85;s.x=rr(-3,3);s.y=rr(-2,-.2)}const a=[W/2+s.x*U/(1+s.z/7),CY+s.y*V/(1+s.z/7)];ctx.globalAlpha=.6;ctx.fillStyle='#d8f4ff';ctx.fillRect(a[0],a[1],1.5,1.5)}ctx.globalAlpha=1;
 const off=(MT*.7)%1;ctx.globalAlpha=.5;ctx.strokeStyle='#ff2bd6';ctx.lineWidth=1;ctx.beginPath();for(let i=-10;i<=10;i++){ctx.moveTo(W/2,CY);ctx.lineTo(W/2+i*W*.3,H)}for(let k=0;k<14;k++){const y=CY+(H-CY)*Math.pow((k+off)/14,2.4);ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.globalAlpha=1;CY=H*.46}

cv.addEventListener('pointerdown',e=>{if(mode==='race'&&!RC.over&&!RC.paused&&drag===null){drag=e.pointerId;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
 else if(mode==='hub'){HUB.press=true;HUB.tx=cl(e.clientX+cl(HUB.x-W/2,0,Math.max(0,WORLD-W)),40,WORLD-40)}});

 else if(mode==='hub'&&HUB.press){HUB.tx=cl(e.clientX+cl(HUB.x-W/2,0,Math.max(0,WORLD-W)),40,WORLD-40)}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(e.pointerId===drag)drag=null;HUB.press=false}));

   19. INSTALLABILITY (home-screen icon + manifest, generated at runtime)

function makeIcon(){try{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,192);g.addColorStop(0,'#07040f');g.addColorStop(1,'#2a0a45');x.fillStyle=g;x.fillRect(0,0,192,192);
 x.strokeStyle='#ff2bd6';x.globalAlpha=.5;for(let i=-6;i<=6;i++){x.beginPath();x.moveTo(96,110);x.lineTo(96+i*40,192);x.stroke()}x.globalAlpha=1;
 drawShip(x,96,92,46,computeShip(),{t:1,boost:true});const url=c.toDataURL('image/png');$('#ico').href=url;$('#aico').href=url;
 const m={name:'STAR-CRUSH // MEGALOTTO',short_name:'MEGALOTTO',start_url:location.href.split('#')[0],display:'fullscreen',orientation:'portrait',background_color:'#07040f',theme_color:'#07040f',icons:[{src:url,sizes:'192x192',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}}

/* ===========================================================================
   20. MAIN LOOP & BOOT
   =========================================================================== */
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
 if(innerWidth!==W||innerHeight!==H)rs();
 if(W<4||H<4){requestAnimationFrame(loop);return} // window not laid out yet: skip the frame
 try{if(mode==='race'){raceUpd(dt);if(mode==='race')raceDraw(dt)}else if(mode==='hub'){hubUpd(dt);hubDraw();postFX(.36,0)}else{menuDraw(dt);postFX(.32,0)}
  // auto quality: if the phone can't hold ~40fps in a race, drop chromatic aberration and soften bloom
  if(mode==='race'&&!RC.paused){FT=lerp(FT,dt,.03);if(++FTN>150&&FT>.025&&FXQ>0){FXQ=0;FTN=0}}if(PV)PV(ts/1000)}catch(err){console.error(err)}
 requestAnimationFrame(loop)}
load();rs();HAP.init();if(!S.pilot&&S.runs)S.pilot=randPilot();makeIcon();scrBoot();requestAnimationFrame(loop);
